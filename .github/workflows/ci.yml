name: CI

on:
  push:
  pull_request:

jobs:
  # Roda o build de produção (gera config, troca id/class, minifica) com
  # variáveis falsas, só pra pegar erro no pipeline antes da Vercel publicar.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          TMDB_API_KEY: build-check
          FIREBASE_API_KEY: build-check
          FIREBASE_AUTH_DOMAIN: build-check
          FIREBASE_PROJECT_ID: build-check
          FIREBASE_STORAGE_BUCKET: build-check
          FIREBASE_MESSAGING_SENDER_ID: build-check
          FIREBASE_APP_ID: build-check
      - run: for f in js/*.js sw.js api/*.js; do node --check "$f"; done
